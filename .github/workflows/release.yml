name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build React & Electron
        run: |
          npx webpack --config webpack.react.config.js --mode production
          npx webpack --config webpack.electron.config.js --mode production
          cp src/electron/preload.js dist/electron/preload.js

      - name: Take screenshot
        run: |
          # 启动虚拟显示器
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          export DISPLAY=:99

          # 运行 Electron 应用截图模式
          npx electron . --screenshot=docs/screenshot.png &
          ELECTRON_PID=$!

          # 等待截图完成（最多 60s）
          for i in $(seq 1 60); do
            if [ -f docs/screenshot.png ]; then
              echo "Screenshot captured after ${i}s"
              break
            fi
            sleep 1
          done

          # 确保进程已结束
          kill $ELECTRON_PID 2>/dev/null || true
          wait $ELECTRON_PID 2>/dev/null || true

          # 验证截图
          if [ ! -f docs/screenshot.png ]; then
            echo "⚠️ Screenshot not captured, creating placeholder"
            mkdir -p docs
            # 创建 1x1 占位图
            printf '\x89PNG\r\n\x1a\n' > docs/screenshot.png
          fi

      - name: Update README with screenshot
        run: |
          node scripts/update-readme-screenshot.js

      - name: Commit and push screenshot + README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot.png README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update app screenshot [skip ci]"
            git push
          fi

  release:
    needs: screenshot
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npx webpack --config webpack.react.config.js --mode production

      - name: Build Electron
        run: npx webpack --config webpack.electron.config.js --mode production

      - name: Copy preload
        run: cp src/electron/preload.js dist/electron/preload.js

      - name: Build macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --config.compression=maximum --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --config.compression=maximum --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --config.compression=maximum --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-builds
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.nsis.zip
            dist/*.portable.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 5

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.nsis.zip" -o \
            -name "*.portable.zip" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.yml" -o \
            -name "*.blockmap" \
          \) -exec cp {} release-files/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenSkill Manager ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
